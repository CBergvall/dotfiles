# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"  # true color
set -g mouse on                   # click to focus panes/windows
set -g base-index 1               # windows start at 1 (easier to reach)
setw -g pane-base-index 1
set -g renumber-windows on        # fill gaps when a window closes
set -s escape-time 0              # no delay after Esc (important for vim)
set -g history-limit 10000

# ── Vim keys ──────────────────────────────────────────────────────────────────
setw -g mode-keys vi              # vi keys in copy mode

# Pane navigation (prefix + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (prefix + HJKL, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Splits that open in the current directory
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"   # Catppuccin Mocha palette
                                                # swap colors to match your theme

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=#89b4fa,bold] #S #[fg=#45475a]│ "

# Right: time
set -g status-right-length 40
set -g status-right "#[fg=#45475a]│ #[fg=#a6adc8]%H:%M #[fg=#45475a]│ #[fg=#a6adc8]%d %b"

# Window list (centered)
set -g status-justify centre
setw -g window-status-format "#[fg=#6c7086] #I:#W "
setw -g window-status-current-format "#[fg=#cdd6f4,bold,bg=#313244] #I:#W "

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"
